<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AlgoVision</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><small>ALGORITHM VISUALIZATION</small><h1>AlgoVision</h1><p>Interactive Sorting Visualizer</p></div><b id="status">READY</b></header><section class="panel controls"><label>Algorithm<select id="algorithm"><option>Bubble Sort</option><option>Selection Sort</option><option>Insertion Sort</option></select></label><label>Enter numbers<input id="data" value="64 25 12 22 11 90 45"></label><button id="load">Load</button><button id="random">Random</button><button id="start">Start</button><button id="pause">Pause</button><button id="resume">Resume</button><button id="reset">Reset</button><label>Speed<input id="speed" type="range" min="1" max="100" value="55"><span id="speedValue">55%</span></label></section><section class="panel"><h3 id="vizTitle">Bubble Sort Visualization</h3><div id="bars"></div><p id="op">Enter data and press Start.</p></section><section class="metrics"><div class="panel">Comparisons<strong id="cmp">0</strong></div><div class="panel">Swaps<strong id="swp">0</strong></div><div class="panel">Operations<strong id="ops">0</strong></div></section><section class="panel"><h3>Complexity Analysis</h3><div class="complexity"><div>Best Case<strong id="best">O(n)</strong></div><div>Average Case<strong id="avg">O(n²)</strong></div><div>Worst Case<strong id="worst">O(n²)</strong></div><div>Space<strong>O(1)</strong></div></div></section></main><script src="script.js"></script></body></html>
